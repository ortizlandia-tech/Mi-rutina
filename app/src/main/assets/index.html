<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Gym</title>
<style>
:root{
  --bg:#0C4257;
  --bg2:#083548;
  --panel:#123F50;
  --panel2:#174B5D;
  --orange:#E68E37;
  --orange2:#F39A3D;
  --text:#FFFFFF;
  --muted:#B9CBD2;
  --line:rgba(255,255,255,.16);
  --dark:#082F3F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
button{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}

/* HOME */
.homeTop{display:flex;justify-content:center;align-items:flex-start;position:relative;margin-top:8px}
.logo{width:172px;height:172px;object-fit:contain;border-radius:28px}
.gear{position:absolute;right:2px;top:3px;border:0;background:transparent;font-size:29px;color:#D9E5E9;padding:8px}
.heroTitle{text-align:center;font-size:40px;line-height:1.03;font-weight:950;letter-spacing:.4px;margin:18px 0 28px;text-transform:uppercase}
.routineStack{display:grid;gap:14px}
.routineCard{width:100%;min-height:112px;border:0;border-radius:25px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#083548;display:flex;align-items:center;gap:20px;padding:18px 24px;text-align:left;box-shadow:0 8px 26px rgba(0,0,0,.12)}
.dumbbell{font-size:46px;line-height:1;font-weight:900}
.routineCard strong{display:block;font-size:27px;line-height:1;font-weight:950;letter-spacing:.2px}
.routineCard span{display:block;font-size:18px;margin-top:6px}
.homeNav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.navCard{min-height:112px;border:1px solid rgba(255,255,255,.28);border-radius:20px;background:rgba(255,255,255,.025);font-weight:800;font-size:13px;padding:13px 6px}
.navIcon{font-size:31px;display:block;margin-bottom:8px}

/* WORKOUT */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 0 15px;border-bottom:1px solid var(--line)}
.exit{justify-self:start;border:0;background:transparent;padding:8px 4px;font-size:18px}
.topTitle{font-size:19px;font-weight:850}.counter{justify-self:end;font-size:18px;font-weight:850}
.progressTrack{height:9px;border-radius:999px;background:rgba(255,255,255,.17);margin:0 0 22px;overflow:hidden}
.progressFill{height:100%;background:var(--orange);border-radius:999px;width:10%;transition:width .25s}
.exerciseTitle{text-align:center;font-size:34px;line-height:1.05;font-weight:950;margin:24px 0 8px}
.exerciseMeta{text-align:center;color:var(--muted);font-size:17px;margin-bottom:22px}
.visual{height:300px;border-radius:24px;background:#EFEDE9;position:relative;overflow:hidden;margin:0 auto 22px;max-width:500px}
.floor{position:absolute;left:12%;right:12%;bottom:24px;height:18px;border-radius:50%;background:#0003;filter:blur(4px)}
.human{position:absolute;left:50%;top:46%;width:170px;height:270px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 10px #0004)}
.headp{position:absolute;left:66px;top:0;width:40px;height:48px;background:linear-gradient(135deg,#555,#151515);border-radius:48% 48% 45% 45%}
.torso{position:absolute;left:47px;top:43px;width:78px;height:100px;background:linear-gradient(135deg,#383D41,#101214);border-radius:36% 36% 20% 20%}
.shorts{position:absolute;left:50px;top:132px;width:72px;height:48px;background:#080A0C;clip-path:polygon(0 0,100% 0,85% 100%,57% 100%,50% 55%,43% 100%,15% 100%)}
.limb{position:absolute;background:linear-gradient(135deg,#32363A,#0C0E10);border-radius:999px;transform-origin:top center}
.armL{left:42px;top:64px;width:22px;height:112px;transform:rotate(20deg)}.armR{right:42px;top:64px;width:22px;height:112px;transform:rotate(-20deg)}
.legL{left:57px;top:165px;width:28px;height:115px;transform:rotate(8deg)}.legR{right:57px;top:165px;width:28px;height:115px;transform:rotate(-8deg)}
.barbell{position:absolute;left:50%;top:89px;width:260px;height:8px;background:#879298;transform:translateX(-50%);border-radius:4px}.barbell:before,.barbell:after{content:"";position:absolute;top:50%;width:34px;height:34px;border-radius:50%;background:#111;border:8px solid #353D42;transform:translateY(-50%)}.barbell:before{left:-8px}.barbell:after{right:-8px}
.pullbar{display:none;position:absolute;left:12%;right:12%;top:36px;height:10px;background:#7D888E;border-radius:8px}.bench{display:none;position:absolute;left:20%;right:20%;bottom:70px;height:18px;background:#30383E;border-radius:10px}.mat{display:none;position:absolute;left:12%;right:12%;bottom:32px;height:16px;background:#63727A;border-radius:50%}
.squat .human{animation:squat 1.8s ease-in-out infinite alternate}.pull .human{animation:pull 1.55s ease-in-out infinite alternate}.hinge .human{animation:hinge 1.8s ease-in-out infinite alternate;transform-origin:50% 72%}.press .human{animation:press 1.5s ease-in-out infinite alternate}.lunge .human{animation:lunge 1.8s ease-in-out infinite alternate}.core .human{animation:core 1.8s ease-in-out infinite alternate}.raise .armL{animation:raiseL 1.5s ease-in-out infinite alternate}.raise .armR{animation:raiseR 1.5s ease-in-out infinite alternate}
@keyframes squat{to{transform:translate(-50%,-42%) scaleY(.82)}}@keyframes pull{to{transform:translate(-50%,-63%)}}@keyframes hinge{to{transform:translate(-50%,-50%) rotate(18deg)}}@keyframes press{to{transform:translate(-50%,-56%)}}@keyframes lunge{to{transform:translate(-42%,-43%) scaleY(.92)}}@keyframes core{to{transform:translate(-50%,-48%) rotate(2deg)}}@keyframes raiseL{to{transform:rotate(-58deg)}}@keyframes raiseR{to{transform:rotate(58deg)}}
.workStats{display:grid;grid-template-columns:1fr 178px 1fr;align-items:center;gap:8px;max-width:540px;margin:0 auto}
.sideStat{text-align:center;color:var(--muted);font-size:15px}.sideStat strong{display:block;color:#fff;font-size:27px;margin-top:3px}
.repCircle{width:178px;height:178px;border-radius:50%;background:conic-gradient(var(--orange) var(--pct,100%),rgba(255,255,255,.17) 0);display:grid;place-items:center;position:relative}
.repCircle:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.repInside{z-index:1;text-align:center}.repMain{font-size:44px;line-height:1;font-weight:950}.repLabel{font-size:14px;color:var(--muted);margin-top:5px}.smallTime{font-size:13px;color:var(--muted);margin-top:6px}
.cue{max-width:540px;margin:18px auto 0;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);color:#D8E4E8;font-size:14px}
.primary{width:100%;max-width:540px;margin:18px auto 0;display:block;min-height:70px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:19px;font-weight:900}
.secondaryRow{max-width:540px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{min-height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-weight:750;color:#DDE8EB}

/* REST */
.restCenter{text-align:center;padding-top:28px}.wellDone{font-size:36px;font-weight:950;margin:0}.restLabel{font-size:25px;font-weight:800;margin-top:2px}
.restCircle{width:265px;height:265px;margin:28px auto 16px;border-radius:50%;background:conic-gradient(var(--orange) var(--pct,100%),rgba(255,255,255,.17) 0);display:grid;place-items:center;position:relative}.restCircle:after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--bg)}.restTime{position:relative;z-index:1;font-size:55px;font-weight:950;font-variant-numeric:tabular-nums}
.voiceLine{font-size:18px;color:#E4ECEF;margin:8px 0 24px}.nextCard{max-width:540px;margin:auto;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.045);border-radius:22px;padding:18px;text-align:left}.nextCard small{color:var(--muted);font-size:14px}.nextCard strong{display:block;font-size:26px;margin-top:6px}.nextCard span{color:#D4E0E4;font-size:14px}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.56);z-index:50;padding:22px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,620px);background:#0D394B;border:1px solid rgba(255,255,255,.18);border-radius:26px;padding:22px;box-shadow:0 24px 80px #0008}.sheet h2{margin:0 0 16px;font-size:27px}.sheet p{color:var(--muted)}.sheetRow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.toggle{appearance:none;width:54px;height:30px;border-radius:99px;background:#456474;position:relative}.toggle:checked{background:var(--orange)}.toggle:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s}.toggle:checked:after{left:27px}.closeSheet{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--orange);font-weight:850;margin-top:12px}
.historyItem{padding:11px 0;border-top:1px solid var(--line);color:#DCE6E9}.historyItem small{display:block;color:var(--muted);margin-top:3px}
@media(max-width:430px){.heroTitle{font-size:34px}.logo{width:150px;height:150px}.visual{height:260px}.workStats{grid-template-columns:1fr 150px 1fr}.repCircle{width:150px;height:150px}.repMain{font-size:38px}.restCircle{width:235px;height:235px}}
@media(prefers-reduced-motion:reduce){.human,.limb{animation:none!important}}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen active">
  <div class="homeTop">
    <img src="logo.png" class="logo" alt="Home Gym">
    <button class="gear" id="gear" aria-label="Ajustes">⚙</button>
  </div>
  <div class="heroTitle">Tu rutina<br>en casa</div>
  <div class="routineStack">
    <button class="routineCard" data-routine="A"><div class="dumbbell">🏋</div><div><strong>RUTINA A</strong><span>Cuerpo completo</span></div></button>
    <button class="routineCard" data-routine="B"><div class="dumbbell">🏋</div><div><strong>RUTINA B</strong><span>Cuerpo completo</span></div></button>
  </div>
  <div class="homeNav">
    <button class="navCard" id="progressBtn"><span class="navIcon">▥</span>PROGRESO</button>
    <button class="navCard" id="historyBtn"><span class="navIcon">◷</span>HISTORIAL</button>
    <button class="navCard" id="settingsBtn"><span class="navIcon">☷</span>AJUSTES</button>
  </div>
</section>

<section id="workout" class="screen">
  <div class="topbar">
    <button id="exit" class="exit">‹&nbsp; Salir</button>
    <div id="rname" class="topTitle">Rutina A</div>
    <div id="prog" class="counter">1/7</div>
  </div>
  <div class="progressTrack"><div id="progressFill" class="progressFill"></div></div>
  <div id="ename" class="exerciseTitle">Sentadilla</div>
  <div id="sinfo" class="exerciseMeta">4 series • 8–12 repeticiones</div>
  <div id="visual" class="visual squat">
    <div class="floor"></div><div id="barbell" class="barbell"></div><div id="pullbar" class="pullbar"></div><div id="bench" class="bench"></div><div id="mat" class="mat"></div>
    <div class="human"><div class="headp"></div><div class="torso"></div><div class="shorts"></div><div class="limb armL"></div><div class="limb armR"></div><div class="limb legL"></div><div class="limb legR"></div></div>
  </div>
  <div class="workStats">
    <div class="sideStat">Serie<strong id="seriesText">1/4</strong></div>
    <div id="workCircle" class="repCircle" style="--pct:100%"><div class="repInside"><div id="repMain" class="repMain">8–12</div><div id="repLabel" class="repLabel">repeticiones</div><div id="workTime" class="smallTime">00:45 restante</div></div></div>
    <div class="sideStat">Descanso<strong id="restText">90 seg</strong></div>
  </div>
  <div id="cue" class="cue"></div>
  <button id="done" class="primary">✓ &nbsp; Completar serie</button>
  <div class="secondaryRow"><button id="pause" class="secondary">Ⅱ Pausa</button><button id="skip" class="secondary">Saltar ejercicio</button></div>
</section>

<section id="rest" class="screen">
  <div class="topbar"><button id="exitRest" class="exit">‹&nbsp; Salir</button><div id="restRname" class="topTitle">Rutina A</div><div id="restProg" class="counter">1/7</div></div>
  <div class="restCenter">
    <div class="wellDone">¡Bien hecho!</div><div class="restLabel">Descanso</div>
    <div id="restCircle" class="restCircle" style="--pct:100%"><div id="restTime" class="restTime">00:15</div></div>
    <div id="voiceLine" class="voiceLine">🔊 Próximo ejercicio en 15 segundos</div>
    <div class="nextCard"><small id="nextSmall">Siguiente ejercicio</small><strong id="nextName">Press de banca</strong><span id="nextMeta">4 series • 8–12 repeticiones</span></div>
    <button id="skipRest" class="primary">» &nbsp; Omitir descanso</button>
  </div>
</section>
</main>

<div id="modal" class="modal"><div class="sheet"><div id="sheetContent"></div><button id="closeSheet" class="closeSheet">Cerrar</button></div></div>

<script>
const R={
A:[
['Sentadilla con barra',4,'8–12',45,90,'squat','bar','Pecho arriba, abdomen firme y bajá con control. Rodillas alineadas con los pies.'],
['Press de banca',4,'8–12',45,90,'press','bench','Escápulas apoyadas, pies firmes y barra controlada hacia el centro del pecho.'],
['Dominadas',4,'las que puedas',40,90,'pull','pull','Subí sin balancearte y llevá el pecho hacia la barra.'],
['Peso muerto rumano',3,'10–12',45,90,'hinge','bar','Cadera hacia atrás, espalda neutra y barra cerca de las piernas.'],
['Fondos en paralelas',3,'6–12',40,75,'press','none','Descendé con control sin forzar los hombros.'],
['Remo con barra',3,'8–12',45,75,'hinge','bar','Torso firme y barra hacia el abdomen.'],
['Plancha',3,'40–60 s',50,45,'core','mat','Glúteos y abdomen activos. Mantené el cuerpo alineado.']],
B:[
['Zancadas',3,'10 por pierna',50,75,'lunge','none','Paso largo, torso erguido y rodilla delantera estable.'],
['Press militar',4,'8–12',45,90,'press','bar','Abdomen firme y barra subiendo cerca de la cara.'],
['Dominadas supinas',4,'las que puedas',40,90,'pull','pull','Palmas hacia vos. Subí sin impulso.'],
['Hip thrust',4,'10–15',45,75,'squat','bench','Extensión completa de cadera sin arquear la zona lumbar.'],
['Flexiones',3,'12–20',45,60,'press','mat','Cuerpo alineado y pecho descendiendo entre las manos.'],
['Curl de bíceps',3,'10–15',40,60,'pull','bar','Codos junto al cuerpo y sin balancear el torso.'],
['Elevaciones laterales',3,'12–15',40,45,'raise','none','Subí hasta la altura de los hombros con control.'],
['Dead bug / rodillas',3,'10–15',45,45,'core','mat','Zona lumbar estable contra la colchoneta.']]};
const $=id=>document.getElementById(id), fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');
let key='A',idx=0,setNo=1,phase='idle',rem=0,max=1,tickId=null,startAt=0,paused=false,pauseAt=0,pausedMs=0;
let voiceEnabled=localStorage.getItem('voiceEnabled')!=='0',soundEnabled=localStorage.getItem('soundEnabled')!=='0';
const cur=()=>R[key][idx];
function say(t){if(!voiceEnabled)return;try{if(window.WorkoutNative)WorkoutNative.speak(t)}catch(e){}}
function stopVoice(){try{if(window.WorkoutNative)WorkoutNative.stopSpeech()}catch(e){}}
function beep(k='tick'){if(!soundEnabled)return;try{if(window.WorkoutNative)WorkoutNative.beep(k)}catch(e){}}
function showScreen(id){['home','workout','rest'].forEach(x=>$(x).classList.toggle('active',x===id))}
function equipment(t){$('barbell').style.display=t==='bar'?'block':'none';$('pullbar').style.display=t==='pull'?'block':'none';$('bench').style.display=t==='bench'?'block':'none';$('mat').style.display=t==='mat'?'block':'none'}
function targetDisplay(v){if(v.includes('s'))return [v,'objetivo'];if(v==='las que puedas')return ['AMRAP','repeticiones'];if(v.includes('por pierna'))return ['10','por pierna'];return [v,'repeticiones']}
function renderWork(){const e=cur(),td=targetDisplay(e[2]);$('rname').textContent='Rutina '+key;$('prog').textContent=(idx+1)+'/'+R[key].length;$('progressFill').style.width=(((idx)+(setNo/e[1]))/R[key].length*100)+'%';$('ename').textContent=e[0];$('sinfo').textContent=e[1]+' series • '+e[2]+(e[2].includes('s')?'':' repeticiones');$('seriesText').textContent=setNo+'/'+e[1];$('restText').textContent=e[4]+' seg';$('repMain').textContent=td[0];$('repLabel').textContent=td[1];$('workTime').textContent=fmt(rem)+' restante';$('workCircle').style.setProperty('--pct',(rem/Math.max(1,max)*100)+'%');$('cue').textContent='💡 '+e[7];$('visual').className='visual '+e[5];equipment(e[6])}
function renderRest(){const e=cur();$('restRname').textContent='Rutina '+key;$('restProg').textContent=(idx+1)+'/'+R[key].length;$('restTime').textContent=fmt(rem);$('restCircle').style.setProperty('--pct',(rem/Math.max(1,max)*100)+'%');let nx,meta;if(phase==='rest'){nx=e[0];meta='Serie '+(setNo+1)+' de '+e[1];$('nextSmall').textContent='Siguiente serie';$('voiceLine').textContent='🔊 Próxima serie en '+rem+' segundos'}else{const n=R[key][idx+1];nx=n?n[0]:'Fin de rutina';meta=n?(n[1]+' series • '+n[2]+' repeticiones'):'¡Último esfuerzo completado!';$('nextSmall').textContent='Siguiente ejercicio';$('voiceLine').textContent='🔊 Próximo ejercicio en '+rem+' segundos'}$('nextName').textContent=nx;$('nextMeta').textContent=meta}
function setPhase(p){phase=p;const e=cur();if(p==='work'){rem=max=e[3];showScreen('workout');renderWork();say((setNo===1?'Ejercicio. ':'')+e[0]+'. Serie '+setNo+' de '+e[1]+'.')}else if(p==='rest'){rem=max=e[4];showScreen('rest');renderRest();say('Bien hecho. Descanso de '+e[4]+' segundos. Próxima serie, '+(setNo+1)+' de '+e[1]+'.')}else if(p==='transition'){rem=max=90;showScreen('rest');renderRest();let nx=R[key][idx+1]?.[0]||'fin de rutina';say('Bien hecho. Descanso. Próximo ejercicio: '+nx+'.')}}
function advance(){const e=cur();if(phase==='work'){if(setNo<e[1])setPhase('rest');else if(idx<R[key].length-1)setPhase('transition');else finish()}else if(phase==='rest'){setNo++;setPhase('work')}else if(phase==='transition'){idx++;setNo=1;setPhase('work')}}
function tick(){if(paused||phase==='idle'||phase==='done')return;rem--;if(rem===10&&(phase==='rest'||phase==='transition'))say('Diez segundos.');if(rem>0&&rem<=3)beep('tick');if(rem<=0){beep('go');if(navigator.vibrate)navigator.vibrate([120,70,120]);advance()}else{if(phase==='work')renderWork();else renderRest()}}
function start(k){key=k;idx=0;setNo=1;paused=false;pausedMs=0;startAt=Date.now();clearInterval(tickId);setPhase('work');tickId=setInterval(tick,1000);beep('go')}
function saveHistory(){const secs=Math.max(0,Math.floor((Date.now()-startAt-pausedMs)/1000));const h=JSON.parse(localStorage.getItem('history')||'[]');h.unshift({routine:key,date:new Date().toISOString(),secs});localStorage.setItem('history',JSON.stringify(h.slice(0,30)))}
function finish(){phase='done';clearInterval(tickId);beep('finish');saveHistory();say('Rutina completada. Buen trabajo.');setTimeout(()=>{phase='idle';showScreen('home')},1400)}
function exitWorkout(){if(phase==='idle'||phase==='done'){showScreen('home');return true}if(!confirm('¿Finalizar entrenamiento y volver al menú?'))return false;clearInterval(tickId);stopVoice();phase='idle';paused=false;showScreen('home');return true}
function togglePause(){paused=!paused;if(paused){pauseAt=Date.now();stopVoice();$('pause').textContent='▶ Continuar';say('Pausa.')}else{pausedMs+=Date.now()-pauseAt;$('pause').textContent='Ⅱ Pausa';say('Continuamos.')}}
function openSheet(kind){let html='';if(kind==='settings'){html='<h2>Ajustes</h2><div class="sheetRow"><span>Voz de entrenamiento</span><input id="voiceToggle" class="toggle" type="checkbox" '+(voiceEnabled?'checked':'')+'></div><div class="sheetRow"><span>Sonidos de timer</span><input id="soundToggle" class="toggle" type="checkbox" '+(soundEnabled?'checked':'')+'></div><p>La voz usa el motor de Android en Español (Argentina) y prioriza una voz femenina disponible.</p>'}else if(kind==='history'){const h=JSON.parse(localStorage.getItem('history')||'[]');html='<h2>Historial</h2>'+(h.length?h.map(x=>'<div class="historyItem"><b>Rutina '+x.routine+'</b><small>'+new Date(x.date).toLocaleString('es-AR')+' · '+Math.round(x.secs/60)+' min</small></div>').join(''):'<p>Todavía no hay entrenamientos completados.</p>')}else{const h=JSON.parse(localStorage.getItem('history')||'[]');const total=h.reduce((a,x)=>a+x.secs,0);html='<h2>Progreso</h2><div class="sheetRow"><span>Entrenamientos completados</span><b>'+h.length+'</b></div><div class="sheetRow"><span>Tiempo total</span><b>'+Math.round(total/60)+' min</b></div><div class="sheetRow"><span>Última rutina</span><b>'+(h[0]?('Rutina '+h[0].routine):'—')+'</b></div>'}$('sheetContent').innerHTML=html;$('modal').classList.add('show');if(kind==='settings'){setTimeout(()=>{$('voiceToggle').onchange=e=>{voiceEnabled=e.target.checked;localStorage.setItem('voiceEnabled',voiceEnabled?'1':'0')};$('soundToggle').onchange=e=>{soundEnabled=e.target.checked;localStorage.setItem('soundEnabled',soundEnabled?'1':'0')}},0)}}
window.handleAndroidBack=()=>{if($('modal').classList.contains('show')){$('modal').classList.remove('show');return true}if(phase!=='idle'&&phase!=='done'){exitWorkout();return true}return false};
document.querySelectorAll('.routineCard').forEach(b=>b.onclick=()=>start(b.dataset.routine));$('exit').onclick=$('exitRest').onclick=exitWorkout;$('done').onclick=()=>phase==='work'&&advance();$('skipRest').onclick=()=>advance();$('skip').onclick=()=>{if(idx<R[key].length-1){idx++;setNo=1;setPhase('work')}else finish()};$('pause').onclick=togglePause;$('gear').onclick=$('settingsBtn').onclick=()=>openSheet('settings');$('historyBtn').onclick=()=>openSheet('history');$('progressBtn').onclick=()=>openSheet('progress');$('closeSheet').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
</script>
</body>
</html>
