<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Rutina</title>
<style>
:root{--bg:#0b0f12;--panel:#11171c;--card:#171e24;--border:#26323b;--text:#f4f7f8;--muted:#98a6af;--accent:#42d39a;--blue:#63b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button{font:inherit;color:inherit}.app{max-width:720px;margin:auto;padding:18px 16px 28px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.title{font-size:32px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.pill{border:1px solid var(--border);border-radius:999px;padding:8px 10px;font-size:12px;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{min-height:52px;border-radius:16px;border:1px solid var(--border);background:transparent;font-weight:700}.btn.active,.primary{background:var(--accent);border-color:var(--accent);color:#06120d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:var(--card);border-radius:16px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--muted)}.list{display:grid;gap:9px;margin-top:16px}.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:11px 12px}.num{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center}.row .meta{font-size:12px;color:var(--muted)}.row .name{font-weight:700}.start{width:100%;margin-top:16px;min-height:58px;border-radius:18px;border:0;background:var(--accent);color:#07120d;font-size:18px;font-weight:800}.workout{display:none}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:12px}.muted{color:var(--muted)}.center{text-align:center}.exname{font-size:30px;font-weight:800;margin-top:22px}.setinfo{color:var(--muted);margin-top:5px}.timerWrap{display:grid;place-items:center;margin:24px auto 16px;width:210px;height:210px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct,100%),var(--card) 0);position:relative}.timerWrap:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel)}.timerIn{position:relative;z-index:1;text-align:center}.timer{font-size:54px;font-weight:900;font-variant-numeric:tabular-nums}.phase{color:var(--muted);font-weight:700}.visual{background:linear-gradient(180deg,#151c21,#0d1115);border-radius:24px;min-height:330px;position:relative;overflow:hidden;border:1px solid var(--border)}.floor{position:absolute;left:10%;right:10%;bottom:28px;height:18px;border-radius:50%;background:#0008;filter:blur(4px)}.human{position:absolute;left:50%;top:46%;width:170px;height:270px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 12px #0007)}.headp{position:absolute;left:66px;top:0;width:40px;height:48px;background:linear-gradient(135deg,#555,#151515);border-radius:48% 48% 45% 45%}.torso{position:absolute;left:47px;top:43px;width:78px;height:100px;background:linear-gradient(135deg,#3a3f44,#101214);border-radius:36% 36% 20% 20%}.shorts{position:absolute;left:50px;top:132px;width:72px;height:48px;background:#080a0c;clip-path:polygon(0 0,100% 0,85% 100%,57% 100%,50% 55%,43% 100%,15% 100%)}.limb{position:absolute;background:linear-gradient(135deg,#32363a,#0c0e10);border-radius:999px;transform-origin:top center}.armL{left:42px;top:64px;width:22px;height:112px;transform:rotate(20deg)}.armR{right:42px;top:64px;width:22px;height:112px;transform:rotate(-20deg)}.legL{left:57px;top:165px;width:28px;height:115px;transform:rotate(8deg)}.legR{right:57px;top:165px;width:28px;height:115px;transform:rotate(-8deg)}.barbell{position:absolute;left:50%;top:89px;width:260px;height:8px;background:#aeb7bd;transform:translateX(-50%);border-radius:4px}.barbell:before,.barbell:after{content:"";position:absolute;top:50%;width:34px;height:34px;border-radius:50%;background:#111;border:8px solid #32383d;transform:translateY(-50%)}.barbell:before{left:-8px}.barbell:after{right:-8px}.pullbar{display:none;position:absolute;left:12%;right:12%;top:40px;height:10px;background:#8c969c;border-radius:8px}.bench{display:none;position:absolute;left:20%;right:20%;bottom:75px;height:18px;background:#30383e;border-radius:10px}.mat{display:none;position:absolute;left:12%;right:12%;bottom:35px;height:16px;background:#30383e;border-radius:50%}.cue{margin-top:14px;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button,.skip{min-height:52px;border-radius:16px;border:1px solid var(--border);background:transparent;font-weight:750}.actions .done{background:var(--accent);color:#06120d;border-color:var(--accent)}.skip{width:100%;margin-top:9px}.next{display:none;margin-top:12px;padding:13px;border:1px solid var(--border);border-radius:16px}.next small{color:var(--muted);text-transform:uppercase}.resting .timerWrap{background:conic-gradient(var(--blue) var(--pct,100%),var(--card) 0)}.resting .visual{opacity:.65}.squat .human{animation:squat 1.8s ease-in-out infinite alternate}.pull .human{animation:pull 1.55s ease-in-out infinite alternate}.hinge .human{animation:hinge 1.8s ease-in-out infinite alternate;transform-origin:50% 72%}.press .human{animation:press 1.5s ease-in-out infinite alternate}.lunge .human{animation:lunge 1.8s ease-in-out infinite alternate}.core .human{animation:core 1.8s ease-in-out infinite alternate}.raise .armL{animation:raiseL 1.5s ease-in-out infinite alternate}.raise .armR{animation:raiseR 1.5s ease-in-out infinite alternate}@keyframes squat{to{transform:translate(-50%,-42%) scaleY(.82)}}@keyframes pull{to{transform:translate(-50%,-63%)}}@keyframes hinge{to{transform:translate(-50%,-50%) rotate(18deg)}}@keyframes press{to{transform:translate(-50%,-56%)}}@keyframes lunge{to{transform:translate(-42%,-43%) scaleY(.92)}}@keyframes core{to{transform:translate(-50%,-48%) rotate(2deg)}}@keyframes raiseL{to{transform:rotate(-58deg)}}@keyframes raiseR{to{transform:rotate(58deg)}}@media(prefers-reduced-motion:reduce){.human,.limb{animation:none!important}}
</style></head><body><main class="app"><section id="home"><div class="top"><div><div class="title">Mi Rutina</div><div class="sub">Entrená en casa. Más fuerte cada día.</div></div><div class="pill">3–4× semana</div></div><div class="tabs"><button id="a" class="btn active">Rutina A</button><button id="b" class="btn">Rutina B</button></div><div class="stats"><div class="stat"><b id="cnt">7</b><span>Ejercicios</span></div><div class="stat"><b>~60</b><span>Minutos</span></div><div class="stat"><b>A/B</b><span>Alternada</span></div></div><div id="list" class="list"></div><button id="start" class="start">▶ Comenzar rutina A</button></section><section id="workout" class="workout"><div class="head"><div><b id="rname">Rutina A</b><div id="prog" class="muted">Ejercicio 1 de 7</div></div><div id="elapsed" class="muted">00:00 total</div></div><div class="center"><div id="ename" class="exname"></div><div id="sinfo" class="setinfo"></div></div><div id="timerWrap" class="timerWrap" style="--pct:100%"><div class="timerIn"><div id="timer" class="timer">00:45</div><div id="phase" class="phase">Trabajo</div></div></div><div id="visual" class="visual squat"><div class="floor"></div><div id="barbell" class="barbell"></div><div id="pullbar" class="pullbar"></div><div id="bench" class="bench"></div><div id="mat" class="mat"></div><div class="human"><div class="headp"></div><div class="torso"></div><div class="shorts"></div><div class="limb armL"></div><div class="limb armR"></div><div class="limb legL"></div><div class="limb legR"></div></div></div><div id="cue" class="cue"></div><div id="next" class="next"><small>Próximo</small><div id="nextName" style="font-weight:800;margin-top:4px"></div></div><div class="actions"><button id="pause">Ⅱ Pausa</button><button id="done" class="done">✓ Serie lista</button></div><button id="skip" class="skip">Saltar ejercicio</button></section></main><script>
const R={A:[['Sentadilla con barra',4,'8–12',45,90,'squat','bar','Pecho arriba, abdomen firme y bajá con control. Rodillas alineadas con los pies.'],['Press de banca',4,'8–12',45,90,'press','bench','Escápulas apoyadas, pies firmes y barra controlada hacia el centro del pecho.'],['Dominadas',4,'las que puedas',40,90,'pull','pull','Subí sin balancearte y llevá el pecho hacia la barra.'],['Peso muerto rumano',3,'10–12',45,90,'hinge','bar','Cadera hacia atrás, espalda neutra y barra cerca de las piernas.'],['Fondos en paralelas',3,'6–12',40,75,'press','none','Descendé con control sin forzar los hombros.'],['Remo con barra',3,'8–12',45,75,'hinge','bar','Torso firme y barra hacia el abdomen.'],['Plancha',3,'40–60 s',50,45,'core','mat','Glúteos y abdomen activos. Mantené el cuerpo alineado.']],B:[['Zancadas',3,'10 por pierna',50,75,'lunge','none','Paso largo, torso erguido y rodilla delantera estable.'],['Press militar',4,'8–12',45,90,'press','bar','Abdomen firme y barra subiendo cerca de la cara.'],['Dominadas supinas',4,'las que puedas',40,90,'pull','pull','Palmas hacia vos. Subí sin impulso.'],['Hip thrust',4,'10–15',45,75,'squat','bench','Extensión completa de cadera sin arquear la zona lumbar.'],['Flexiones',3,'12–20',45,60,'press','mat','Cuerpo alineado y pecho descendiendo entre las manos.'],['Curl de bíceps',3,'10–15',40,60,'pull','bar','Codos junto al cuerpo y sin balancear el torso.'],['Elevaciones laterales',3,'12–15',40,45,'raise','none','Subí hasta la altura de los hombros con control.'],['Dead bug / rodillas',3,'10–15',45,45,'core','mat','Zona lumbar estable contra la colchoneta.']]};
let key='A',idx=0,setNo=1,phase='idle',rem=45,max=45,tickId=null,startAt=0,paused=false,pauseAt=0,pausedMs=0;const $=x=>document.getElementById(x),cur=()=>R[key][idx],fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');
function choose(k){if(phase!=='idle'&&phase!=='done')return;key=k;$('a').classList.toggle('active',k==='A');$('b').classList.toggle('active',k==='B');$('start').textContent='▶ Comenzar rutina '+k;$('cnt').textContent=R[k].length;drawList()}
function drawList(){$('list').innerHTML='';R[key].forEach((e,i)=>{$('list').insertAdjacentHTML('beforeend','<div class="row"><div class="num">'+(i+1)+'</div><div><div class="name">'+e[0]+'</div><div class="meta">'+e[1]+' × '+e[2]+'</div></div></div>')})}
function equipment(t){$('barbell').style.display=t==='bar'?'block':'none';$('pullbar').style.display=t==='pull'?'block':'none';$('bench').style.display=t==='bench'?'block':'none';$('mat').style.display=t==='mat'?'block':'none'}
function render(){const e=cur();$('rname').textContent='Rutina '+key;$('prog').textContent='Ejercicio '+(idx+1)+' de '+R[key].length;$('ename').textContent=e[0];$('sinfo').textContent='Serie '+setNo+' de '+e[1]+' · '+e[2];$('timer').textContent=fmt(rem);$('cue').textContent='💡 '+e[7];$('visual').className='visual '+e[5];equipment(e[6]);$('timerWrap').style.setProperty('--pct',(rem/Math.max(1,max)*100)+'%');$('timerWrap').parentElement.classList.toggle('resting',phase==='rest'||phase==='transition');let n=phase==='rest'?e[0]+' · Serie '+Math.min(e[1],setNo+1):R[key][idx+1]?.[0];$('next').style.display=(phase==='rest'||phase==='transition')?'block':'none';$('nextName').textContent=n||'Fin de rutina'}
function setPhase(p){phase=p;let e=cur();if(p==='work'){rem=max=e[3];$('phase').textContent='Trabajo';$('done').disabled=false}else if(p==='rest'){rem=max=e[4];$('phase').textContent='Descanso';$('done').disabled=true}else if(p==='transition'){rem=max=90;$('phase').textContent='Cambio de ejercicio';$('done').disabled=true}render()}
function advance(){let e=cur();if(phase==='work'){if(setNo<e[1])setPhase('rest');else if(idx<R[key].length-1)setPhase('transition');else finish()}else if(phase==='rest'){setNo++;setPhase('work')}else if(phase==='transition'){idx++;setNo=1;setPhase('work')}}
function tick(){if(paused||phase==='idle'||phase==='done')return;rem--;if(rem<=0){if(navigator.vibrate)navigator.vibrate([120,70,120]);advance()}else render();$('elapsed').textContent=fmt(Math.floor((Date.now()-startAt-pausedMs)/1000))+' total'}
function start(){idx=0;setNo=1;paused=false;pausedMs=0;startAt=Date.now();$('home').style.display='none';$('workout').style.display='block';setPhase('work');clearInterval(tickId);tickId=setInterval(tick,1000)}
function finish(){phase='done';clearInterval(tickId);$('phase').textContent='Completado';$('timer').textContent='✓';$('done').disabled=true;$('pause').disabled=true;$('skip').disabled=true;setTimeout(()=>{$('workout').style.display='none';$('home').style.display='block';phase='idle';$('pause').disabled=false;$('skip').disabled=false},1800)}
$('a').onclick=()=>choose('A');$('b').onclick=()=>choose('B');$('start').onclick=start;$('done').onclick=()=>phase==='work'&&advance();$('skip').onclick=()=>{if(idx<R[key].length-1){idx++;setNo=1;setPhase('work')}else finish()};$('pause').onclick=()=>{paused=!paused;if(paused){pauseAt=Date.now();$('pause').textContent='▶ Continuar';$('phase').textContent='Pausa'}else{pausedMs+=Date.now()-pauseAt;$('pause').textContent='Ⅱ Pausa';$('phase').textContent=phase==='work'?'Trabajo':phase==='rest'?'Descanso':'Cambio de ejercicio'}};choose('A');
</script></body></html>
